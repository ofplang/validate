spec_version: "0.0"
features: [node_do_while]
processes:
  step:
    kind: atomic
    inputs:
      n: { type: Int, phase: data }
    outputs:
      n: { type: Int, phase: data }
      go: { type: Bool, phase: data }
  main:
    kind: composite
    inputs:
      n0: { type: Int, phase: data }
    outputs: {}
    body:
      nodes:
        - id: loop
          kind: do_while
          process: step
          carry: { n: { from: inputs.n0 } }
          condition: { output: go }
          max_iterations: { value: 3 }
          outputs:
            n: { mode: carry }
            go: {}
      returns: {}
entry: main

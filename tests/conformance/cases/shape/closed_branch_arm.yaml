spec_version: "0.0"
features: [node_branch]
processes:
  a: { kind: atomic, inputs: {}, outputs: {} }
  main:
    kind: composite
    inputs:
      c: { type: Bool, phase: data }
    outputs: {}
    body:
      nodes:
        - id: b
          kind: branch
          condition: { from: inputs.c }
          then: { process: a, bogus: 1 }
          else: { process: a }
      returns: {}
entry: main

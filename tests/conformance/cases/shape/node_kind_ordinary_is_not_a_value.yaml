# `ordinary` is how the specification *describes* a node that writes no `kind`,
# not a value that may be written.
spec_version: "0.0"
processes:
  wash:
    kind: atomic
    inputs: {}
    outputs: {}
  main:
    kind: composite
    inputs: {}
    outputs: {}
    body:
      nodes:
        - { id: w, kind: ordinary, process: wash }
      returns: {}
entry: main

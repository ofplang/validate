spec_version: "0.0"
types:
  Cup: { domain: object, view: { v: { type: Float } } }
processes:
  main:
    kind: atomic
    inputs:
      xss: { type: Array<Array<Cup>>, phase: data }
    outputs:
      xs: { type: Array<Cup>, phase: data }
    objects:
      transform:
        - kind: array_flatten
          inputs: { xss: inputs.xss }
          outputs: { xs: outputs.xs }
          bogus: 1
entry: main

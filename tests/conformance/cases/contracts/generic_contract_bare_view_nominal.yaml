# A bare `.view` on a `data`-domain parameter is allowed at the definition because
# the parameter may turn out to be a primitive (spec 9.1). This invocation makes it
# a nominal Data type, whose `.view` is a view schema rather than a scalar.
spec_version: "0.0"
types:
  Img:
    domain: data
    view:
      width:
        type: Int
processes:
  positive:
    kind: atomic
    type_params:
      D: { domain: data }
    inputs:
      a: { type: D, phase: data }
    outputs: {}
    contracts:
      requires:
        - expr: "inputs.a.view > 0"
  make_img:
    kind: atomic
    inputs: {}
    outputs:
      v: { type: Img, phase: data }
  main:
    kind: composite
    inputs: {}
    outputs: {}
    body:
      nodes:
        - { id: m, process: make_img }
        - { id: w, process: positive, bind: { a: { from: m.v } } }
      returns: {}
entry: main

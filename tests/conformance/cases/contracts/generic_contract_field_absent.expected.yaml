outcome: invalid
errors:
  - code: unknown_view_field
notes: >
  A contract expression may reference only fields present in the resolved type's
  view schema (spec 9.1). This invocation instantiates `D` to `Blob`, whose view
  schema has no `width`. The `where` constraint cannot catch it: a trait is a
  nominal membership marker and declares no field (spec 7.3).

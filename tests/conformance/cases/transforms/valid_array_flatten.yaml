spec_version: "0.0"
types:
  Cup:
    domain: object
processes:
  flatten:
    kind: atomic
    inputs:
      xss:
        type: Array<Array<Cup>>
        phase: data
    outputs:
      xs:
        type: Array<Cup>
        phase: data
    objects:
      transform:
        - kind: array_flatten
          inputs:
            xss: inputs.xss
          outputs:
            xs: outputs.xs
  main:
    kind: atomic
    inputs: {}
    outputs: {}
entry: main

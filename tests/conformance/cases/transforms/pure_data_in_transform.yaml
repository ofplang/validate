spec_version: "0.0"
processes:
  bad:
    kind: atomic
    inputs:
      xss:
        type: Array<Array<Int>>
        phase: data
    outputs:
      xs:
        type: Array<Int>
        phase: data
    objects:
      transform:
        - kind: array_flatten
          inputs:
            xss: inputs.xss
          outputs:
            xs: outputs.xs
  main:
    kind: atomic
    inputs: {}
    outputs: {}
entry: main

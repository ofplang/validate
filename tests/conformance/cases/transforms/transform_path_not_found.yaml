spec_version: "0.0"
types:
  Sample:
    domain: object
processes:
  bad:
    kind: atomic
    inputs:
      xss:
        type: Array<Array<Sample>>
        phase: data
    outputs:
      xs:
        type: Array<Sample>
        phase: data
    objects:
      transform:
        - kind: array_flatten
          inputs:
            xss: inputs.xss
          outputs:
            xs: outputs.typo
  main:
    kind: atomic
    inputs: {}
    outputs: {}
entry: main

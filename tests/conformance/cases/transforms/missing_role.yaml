spec_version: "0.0"
types:
  Cup:
    domain: object
processes:
  bad:
    kind: atomic
    inputs:
      xss:
        type: Array<Array<Cup>>
        phase: data
    outputs: {}
    objects:
      transform:
        - kind: array_flatten
          inputs:
            xss: inputs.xss
          outputs: {}
  main:
    kind: atomic
    inputs: {}
    outputs: {}
entry: main

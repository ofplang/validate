spec_version: "0.0"
features:
  - node_branch
types:
  Sample: {domain: object}
  Widget: {domain: object}
processes:
  arm_a:
    kind: atomic
    inputs:
      s: {type: Sample, phase: data}
    outputs:
      result: {type: Sample, phase: data}
    objects:
      consume: [inputs.s]
      create: [outputs.result]
  arm_b:
    kind: atomic
    inputs:
      s: {type: Sample, phase: data}
    outputs:
      result: {type: Widget, phase: data}
    objects:
      consume: [inputs.s]
      create: [outputs.result]
  use_sample:
    kind: atomic
    inputs:
      s: {type: Sample, phase: data}
    outputs: {}
    objects:
      consume:
        - inputs.s
  main:
    kind: composite
    inputs:
      s: {type: Sample, phase: data}
      flag: {type: Bool, phase: data}
    body:
      nodes:
        - id: pick
          kind: branch
          condition:
            from: inputs.flag
          args:
            s: {from: inputs.s}
          then:
            process: arm_a
          else:
            process: arm_b
        - id: use
          process: use_sample
          state:
            s: {from: pick.result}
      returns: {}
entry: main

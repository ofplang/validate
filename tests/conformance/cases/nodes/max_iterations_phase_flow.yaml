spec_version: "0.1"
processes:
  src:
    kind: atomic
    outputs:
      v:
        type: Int
        phase: data
  step:
    kind: atomic
    inputs:
      n:
        type: Int
        phase: data
    outputs:
      n:
        type: Int
        phase: data
      continue:
        type: Bool
        phase: data
  main:
    kind: composite
    inputs:
      n0:
        type: Int
        phase: data
    body:
      nodes:
        - id: s
          process: src
        - id: loop
          kind: do_while
          process: step
          carry:
            n:
              from: inputs.n0
          condition:
            output: continue
          max_iterations:
            from: s.v
          outputs:
            n:
              mode: carry
            continue:
              mode: drop
      returns: {}
entry: main

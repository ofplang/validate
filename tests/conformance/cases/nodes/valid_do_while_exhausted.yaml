spec_version: "0.0"
features:
  - node_do_while
processes:
  passage_once:
    kind: atomic
    inputs:
      acc:
        type: Int
        phase: data
    outputs:
      acc:
        type: Int
        phase: data
      go:
        type: Bool
        phase: data
  main:
    kind: composite
    inputs:
      seed:
        type: Int
        phase: data
    outputs:
      hit_limit:
        type: Bool
        phase: data
    body:
      nodes:
        - id: passage
          kind: do_while
          process: passage_once
          carry:
            acc:
              from: inputs.seed
          condition:
            output: go
          max_iterations:
            value: 10
          outputs:
            acc:
              mode: carry
            go:
              mode: drop
      returns:
        hit_limit:
          from: passage.exhausted
entry: main

spec_version: "0.0"
features:
  - node_map
types:
  Cup:
    domain: object
processes:
  int_to_cup:
    kind: atomic
    inputs:
      n:
        type: Int
        phase: data
    outputs:
      cup:
        type: Cup
        phase: data
    objects:
      create:
        - outputs.cup
  cups_use:
    kind: atomic
    inputs:
      cups:
        type: Array<Cup>
        phase: data
    outputs: {}
    objects:
      consume:
        - inputs.cups
  main:
    kind: composite
    inputs: {}
    outputs: {}
    body:
      nodes:
        - id: none
          kind: map
          process: int_to_cup
          each:
            n:
              value: []
        - id: s
          process: cups_use
          state:
            cups:
              from: none.cup
      returns: {}
entry: main

spec_version: "0.0"
features:
  - node_fold
types:
  W:
    domain: object
processes:
  step:
    kind: atomic
    inputs:
      w:
        type: W
        phase: data
      x:
        type: Int
        phase: data
    outputs:
      w:
        type: W
        phase: data
    objects:
      consume:
        - inputs.w
      create:
        - outputs.w
  w_use:
    kind: atomic
    inputs:
      w:
        type: W
        phase: data
    outputs: {}
    objects:
      consume:
        - inputs.w
  main:
    kind: composite
    inputs:
      xs:
        type: Array<Int>
        phase: data
      w0:
        type: W
        phase: data
    outputs: {}
    body:
      nodes:
        - id: f
          kind: fold
          process: step
          carry:
            w:
              from: inputs.w0
          each:
            x:
              from: inputs.xs
          outputs:
            w:
              mode: carry
        - id: u
          process: w_use
          state:
            w:
              from: f.w
      returns: {}
entry: main

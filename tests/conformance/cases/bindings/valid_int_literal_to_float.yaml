# An integer literal is accepted for a Float port -- the same latitude spec 7.4
# gives a static Float view value, and for the same reason (spec 11.1.1).
spec_version: "0.0"
processes:
  heat:
    kind: atomic
    inputs:
      celsius: { type: Float, phase: data }
    outputs:
      ok: { type: Bool, phase: data }
  main:
    kind: composite
    inputs: {}
    outputs:
      ok: { type: Bool, phase: data }
    body:
      nodes:
        - { id: h, process: heat, bind: { celsius: { value: 4 } } }
      returns:
        ok: { from: h.ok }
entry: main

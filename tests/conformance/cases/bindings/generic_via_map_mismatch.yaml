spec_version: "0.0"
features: [node_map, generic_processes]
processes:
  wash:
    kind: atomic
    type_params:
      O: { domain: object }
    inputs:
      item: { type: O, phase: data }
    outputs: {}
    objects:
      consume:
        - inputs.item
  main:
    kind: composite
    inputs:
      ns: { type: "Array<Int>", phase: data }
    outputs: {}
    body:
      nodes:
        - id: wash_all
          kind: map
          process: wash
          each:
            item: { from: inputs.ns }
      returns: {}
entry: main

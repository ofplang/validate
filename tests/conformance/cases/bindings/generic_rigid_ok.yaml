# A generic composite passing its own type parameter to a generic atomic. Inside
# `wash_twice` the parameter U is rigid: unknown, but already fixed by whoever
# instantiates it. It may instantiate the callee's O, and the callee's constraint is
# discharged from what `wash_twice` itself declares (spec 8.1).
spec_version: "0.0"
traits:
  Washable: {}
types:
  Cup:
    domain: object
    implements:
      - Washable
processes:
  wash:
    kind: atomic
    type_params:
      O: { domain: object }
    where:
      - "Washable<O>"
    inputs:
      item: { type: O, phase: data }
    outputs:
      item: { type: O, phase: data }
    objects:
      map:
        outputs.item: inputs.item
  wash_twice:
    kind: composite
    type_params:
      U: { domain: object }
    where:
      - "Washable<U>"
    inputs:
      item: { type: U, phase: data }
    outputs:
      item: { type: U, phase: data }
    body:
      nodes:
        - { id: w, process: wash, state: { item: { from: inputs.item } } }
      returns:
        item: { from: w.item }
  main:
    kind: composite
    inputs:
      cup: { type: Cup, phase: data }
    outputs:
      cup: { type: Cup, phase: data }
    body:
      nodes:
        - { id: t, process: wash_twice, state: { item: { from: inputs.cup } } }
      returns:
        cup: { from: t.item }
entry: main

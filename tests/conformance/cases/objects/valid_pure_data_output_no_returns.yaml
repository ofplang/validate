processes:
  produce:
    kind: atomic
    inputs: {}
    outputs:
      n:
        type: Int
        phase: data
  partial:
    kind: composite
    inputs: {}
    outputs:
      a:
        type: Int
        phase: data
      b:
        type: Int
        phase: data
    body:

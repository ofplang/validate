outcome: invalid
errors:
  - code: uninferable_type_param
notes: >
  T occurs only in `x`, which is bound to a literal. A literal determines no type
  argument -- an integer literal conforms to a Float port as well as an Int one --
  so nothing says which type T is, and an uninferable parameter is a validation
  error (spec 8.1, 11.1.1).

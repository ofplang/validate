spec_version: "0.3"
units:
  s: {}
  min: {}
  uL: {}
  mL: {}
  mg: {}
processes:
  weigh:
    kind: atomic
    inputs:
      conc: {type: "Float[mg*mL^-1]", phase: data}
    outputs: {}
  main:
    kind: composite
    inputs:
      c: {type: "Float[mg/mL]", phase: data}
    outputs: {}
    body:
      nodes:
        - id: w
          process: weigh
          bind: {conc: {from: inputs.c}}

entry: main

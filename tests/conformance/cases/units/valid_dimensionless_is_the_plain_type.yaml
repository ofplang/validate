spec_version: "0.3"
units:
  s: {}
  min: {}
  uL: {}
  mL: {}
  mg: {}
processes:
  wait:
    kind: atomic
    inputs:
      duration: {type: "Float[1]", phase: data}
    outputs: {}
  main:
    kind: composite
    inputs:
      t: {type: Float, phase: data}
    outputs: {}
    body:
      nodes:
        - id: w
          process: wait
          bind: {duration: {from: inputs.t}}

entry: main

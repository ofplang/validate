spec_version: "0.0"
processes:
  step:
    kind: atomic
    inputs:
      x:
        type: Int
        phase: data
  main:
    kind: composite
    inputs:
      a:
        type: Int
        phase: data
    body:
      nodes:
        - id: n
          process: step
          bind:
            x:
              from: inputs.a.view
      returns: {}
entry: main

spec_version: '0.5'
processes:
  low:
    kind: atomic
    inputs:
      x:
        type: Int
        phase: data
    outputs:
      r:
        type: Int
        phase: data
  high:
    kind: atomic
    inputs:
      x:
        type: Int
        phase: data
    outputs:
      r:
        type: Int
        phase: data
  main:
    kind: composite
    inputs:
      x:
        type: Int
        phase: data
      flag:
        type: Bool
        phase: data
    outputs:
      r:
        type: Int
        phase: data
    body:
      nodes:
      - id: P
        kind: branch
        condition:
          from: inputs.flag
        args:
          x:
            from: inputs.x
        then:
          process: high
        else:
          process: low
        outputs:
          r:
            mode: drop
      returns:
        r:
          from: P.r
entry: main

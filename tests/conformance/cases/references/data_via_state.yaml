# The counterpart of object_via_bind: a Pure Data input port bound under `state`.
spec_version: "0.4"
types:
  Cup:
    domain: object
processes:
  heat:
    kind: atomic
    inputs:
      cup:
        type: Cup
        phase: data
      temperature:
        type: Float
        phase: run
    outputs:
      cup:
        type: Cup
        phase: data
    objects:
      map:
        outputs.cup: inputs.cup
  main:
    kind: composite
    inputs:
      cup:
        type: Cup
        phase: data
      temperature:
        type: Float
        phase: run
    outputs:
      cup:
        type: Cup
        phase: data
    body:
      nodes:
        - id: h
          process: heat
          state:
            cup:
              from: inputs.cup
            temperature:
              from: inputs.temperature
      returns:
        cup:
          from: h.cup
entry: main
